}

  --gear: #1f232b; --gear-ink: #9aa2b3; --doc: #262a33; --doc-line: #5c6475; --edge: #4a5161;
  --block: #ec6aa9; --block-soft: #3a1d2c; --advise: #6ea2f2; --advise-soft: #1b2a44;

:root[data-theme="dark"] {

.quote .ln { display: block; padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere }
.quote .ln.on { background: var(--hl) }
.quote .n { display: inline-block; width: 3.2em; color: var(--ink-3); user-select: none; font-variant-numeric: tabular-nums }
.sugg { font: 12px/1.5 var(--f-mono); background: var(--bg); border: 1px dashed var(--rule); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 }

@media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 55vh auto } html, body { height: auto } }

const $ = (s) => document.querySelector(s);

}
const fcose = { name: "fcose", animate: false, quality: "proof", nodeRepulsion: 6000, idealEdgeLength: 45, nestingFactor: 0.5,
  gravityCompound: 1.2, packComponents: true, nodeDimensionsIncludeLabels: true, randomize: true };

function mapElements(onlyPr) {
  const pool = onlyPr ? prFindings : DATA.findings;
  const gears = onlyPr ? new Set([...changed].map(gearOf).concat(pool.flatMap((f) => f.docs.map(gearOf)))) : null;
  const byDoc = new Map();
  pool.forEach((f) => f.docs.forEach((d) => { const s = byDoc.get(d) || { block: 0, advise: 0 }; s[f.gate]++; byDoc.set(d, s); }));
  const el = [];
  const keep = DATA.docs.filter((d) => !gears || gears.has(d.gear));
  new Set(keep.map((d) => d.gear)).forEach((g) => el.push({ data: { id: "g:" + g, label: g } }));
  const ids = new Set(keep.map((d) => d.id));
  keep.forEach((d) => {
    const s = byDoc.get(d.id); const cls = ["doc", "k-" + d.kind];
    if (d.status === "superseded") cls.push("superseded");
    if (s && s.advise) cls.push("has-advise"); if (s && s.block) cls.push("has-block");
    if (changed.has(d.id)) cls.push("changed");
    const marks = (s && s.block ? ` ■${s.block}` : "") + (s && s.advise ? ` ◆${s.advise}` : "") + (changed.has(d.id) ? " ✎" : "");
    el.push({ data: { id: d.id, parent: "g:" + d.gear, label: d.label + marks }, classes: cls.join(" ") });
  });
  DATA.links.forEach((l, i) => { if (ids.has(l.src) && ids.has(l.dst))
    el.push({ data: { id: "l" + i, source: l.src, target: l.dst }, classes: l.link ? "link" : "cite" }); });
  pool.forEach((f, i) => { if (f.docs.length >= 2 && ids.has(f.docs[0]) && ids.has(f.docs[1]))
    el.push({ data: { id: "f" + i, source: f.docs[0], target: f.docs[1], fp: f.fingerprint }, classes: "f-" + f.gate }); });
  return el;
}

function itemHtml(f) {
  const l = f.locations.find((x) => x.line_start) || f.locations[0] || {};
  return `<button class="item ${f.gate}" data-fp="${f.fingerprint}"><span class="mk" aria-label="${f.gate}">${mark(f.gate)}</span>` +
    `<span class="t">${esc(f.title)}</span><span class="w">${esc(short(l.path || ""))}${l.line_start ? ":" + l.line_start : ""}` +
    `${f.docs.length > 1 ? " ↔ " + esc(f.docs.slice(1).map(short).join(", ")) : ""}</span></button>`;

function listPanel(pool, heading, note) {

  $("#panel").innerHTML = `<p class="sub">${esc(heading)}</p>${note ? `<p class="msg">${note}</p>` : ""}` +

function showMap(onlyPr) {
  const els = mapElements(onlyPr);

  // fewer documents: more room per node (one gear's 30 documents overlapped with the six-gear setting)
  draw(els, { ...fcose, nodeRepulsion: n < 50 ? 45000 : 6000, idealEdgeLength: n < 50 ? 110 : 45, nodeSeparation: 90 });
  $("#hint").textContent = "Click a document to list its findings, a coloured edge to open a finding.";

function showFinding(fp) {

    el.push({ data: { id: pid, label: `${short(l.path)}:${l.line_start ?? ""}\n${(l.quote || "").slice(0, 70)}` }, classes: "passage " + gate });

        if (!el.some((x) => x.data.id === d)) el.push({ data: { id: d, label: short(d) }, classes: "doc k-" + (docs.get(d)?.kind || "") });

    : `<span class="pill hops">documents ${f.hops} link hop${f.hops === 1 ? "" : "s"} apart</span>`;

    return `<div class="quote"><header><span>${esc(l.path.replace(/^gears\//, ""))}${l.line_start ? ":" + l.line_start : ""}</span>` +
      `${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">open</a>` : ""}</header>` +

  }).join("");

  $("#panel").innerHTML = `<button class="back" id="back">← back</button>` +
